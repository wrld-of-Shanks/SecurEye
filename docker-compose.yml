version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/specula
      - NETWORK_SERVICE=http://network:5001
      - CODE_SERVICE=http://code:5002
      - DAST_SERVICE=http://dast:5003
      - API_KEY=${API_KEY:-specula-dev-key-change-in-production}
      - CORS_ORIGINS=http://localhost:3001
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  network:
    build:
      context: .
      dockerfile: Dockerfile.network
    ports:
      - "5001:5001"
    restart: unless-stopped

  code:
    build:
      context: .
      dockerfile: Dockerfile.code
    ports:
      - "5002:5002"
    restart: unless-stopped

  dast:
    build:
      context: .
      dockerfile: Dockerfile.dast
    ports:
      - "5003:5003"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "3001:3001"
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  mongo-data:
